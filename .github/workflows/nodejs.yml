name: Node.js CI

on:
  push:
    branches: [ master, v1.0 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 16
          registry-url: 'https://registry.npmjs.org'

      - name: Get version info
        id: version-info
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version.replace(/^v/, '')")
          BRANCH_NAME=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')
          TAG_NAME="publish/$BRANCH_NAME"

          # Debug: Show all available tags
          echo "=== Debug: All tags ==="
          git tag -l "publish/*" || echo "No publish/* tags found"

          # Debug: Show tags matching current branch
          echo "=== Debug: Tags for branch $BRANCH_NAME ==="
          git tag -l "publish/$BRANCH_NAME-*" || echo "No tags matching publish/$BRANCH_NAME-*"

          # Get last published version from git tag for this branch
          # Use git tag -l with pattern match to find tags like publish/v1.0-1.2.5
          LAST_TAG=$(git tag -l "publish/$BRANCH_NAME-*" --sort=-v:refname | head -1)
          echo "=== Debug: LAST_TAG=$LAST_TAG ==="
          LAST_PUBLISHED=$(echo "$LAST_TAG" | sed 's/^[^0-9]*-//' || echo "0.0.0")

          # Validate semver format
          if ! echo "$LAST_PUBLISHED" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Warning: Invalid semver '$LAST_PUBLISHED' from tag '$LAST_TAG', using 0.0.0"
            LAST_PUBLISHED="0.0.0"
          fi

          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "LAST_PUBLISHED=${LAST_PUBLISHED}" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME"
          echo "New version: $NEW_VERSION"
          echo "Last published ($TAG_NAME): $LAST_PUBLISHED"

      - name: Check if should publish
        id: should-publish
        run: |
          NEW="${{ steps.version-info.outputs.NEW_VERSION }}"
          LAST="${{ steps.version-info.outputs.LAST_PUBLISHED }}"

          # Validate NEW version is semver
          if ! echo "$NEW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid semver '$NEW' in package.json"
            echo "SHOULD_PUBLISH=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SHOULD_PUBLISH=$(node -e "
            const last = '$LAST'.split('.').map(Number);
            const next = '$NEW'.split('.').map(Number);
            for (let i = 0; i < 3; i++) {
              if ((next[i] || 0) > (last[i] || 0)) { console.log('true'); process.exit(0); }
              if ((next[i] || 0) < (last[i] || 0)) { console.log('false'); process.exit(0); }
            }
            console.log('false');
          ")
          echo "SHOULD_PUBLISH=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
          echo "New ($NEW) > Last ($LAST)? $SHOULD_PUBLISH"

      - name: Install dependencies
        if: steps.should-publish.outputs.SHOULD_PUBLISH == 'true'
        run: yarn install

      - name: Build
        if: steps.should-publish.outputs.SHOULD_PUBLISH == 'true'
        run: yarn run build

      - name: Publish to npm
        if: steps.should-publish.outputs.SHOULD_PUBLISH == 'true'
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_AUTH_TOKEN }}
          access: public

      - name: Update git tag
        if: steps.should-publish.outputs.SHOULD_PUBLISH == 'true'
        run: |
          TAG_NAME="${{ steps.version-info.outputs.TAG_NAME }}"
          NEW_VERSION="${{ steps.version-info.outputs.NEW_VERSION }}"
          FULL_TAG="${TAG_NAME}-${NEW_VERSION}"
          git tag -f "$FULL_TAG" HEAD
          git push origin "$FULL_TAG" --force

      
